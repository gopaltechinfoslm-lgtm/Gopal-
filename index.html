<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Gopalakrishnan Salem</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#1b1620;--mut:#7b7284;--ac:#1565c0;--ac2:#ff8f00;--line:#e7e1ea;--live:#e53935}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0b12;--card:#1a1522;--tx:#f4eef8;--mut:#a095ad;--ac:#42a5f5;--ac2:#ffb300;--line:#2b2336;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0b12;--card:#1a1522;--tx:#f4eef8;--mut:#a095ad;--ac:#42a5f5;--ac2:#ffb300;--line:#2b2336;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:"Noto Sans Tamil",system-ui,sans-serif;max-width:620px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:20px;margin:0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.add{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.player{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.vidwrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;margin-bottom:12px}
.vidwrap video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:linear-gradient(135deg,rgba(0,0,0,.78),rgba(0,0,0,.55));font-size:15px;line-height:1.6;z-index:1}
.livebadge{position:absolute;top:10px;left:10px;background:var(--live);color:#fff;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.5px;display:none;z-index:2}
.livebadge.pulse{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.t{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--mut);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:8px;margin:20px 0 10px}
.tabs button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--mut)}
.tabs .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer}
.row:active{background:var(--card)}
.row.cur{background:var(--card);border:1px solid var(--line)}
.thumb{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex:none}
.row .i{flex:1;min-width:0;text-align:left}
.row .t{font-size:15px;font-weight:700}
.row .s{font-size:12px}
.del{color:var(--mut);font-size:17px;padding:8px;flex:none;line-height:1}
.empty{text-align:center;color:var(--mut);padding:30px 10px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>📺 Gopalakrishnan Salem</h1>
  <button class="add" id="addb">+ சேர்</button>
</header>
<div class="player">
  <div class="vidwrap">
    <video id="v" controls playsinline preload="metadata"></video>
    <div class="livebadge" id="live">● LIVE</div>
    <div class="placeholder" id="ph">▶ ஒரு சேனல் அல்லது வீடியோவைத் தேர்ந்தெடுக்கவும்</div>
  </div>
  <div class="t" id="tt">Gopalakrishnan Salem</div>
  <div class="s" id="ts">நேரலை டிவி & உள்ளூர் வீடியோ</div>
</div>
<div class="tabs">
  <button class="on" id="t1">நேரலை டிவி</button>
  <button id="t2">வீடியோக்கள்</button>
</div>
<div id="list" aria-live="polite"></div>
<input type="file" id="f" accept="video/*" multiple hidden>
<script>
const $ = id => document.getElementById(id);
const v = $('v');
let hls = null, tab = 0, channels = [], videos = [], cur = -1, curKind = null;
const store = {
  get(k, d) { try { const x = JSON.parse(localStorage.getItem(k)); return x ?? d; } catch (e) { return d; } },
  set(k, val) { try { localStorage.setItem(k, JSON.stringify(val)); } catch (e) {} }
};
const DEFAULT_CHANNELS = [
  { name: 'NASA TV (டெமோ)', url: 'https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8' },
  { name: 'Big Buck Bunny (டெமோ)', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
  { name: 'Apple Sample (டெமோ)', url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8' },
  { name: 'Mux Test (டெமோ)', url: 'https://test-streams.mux.dev/pts_shift/master.m3u8' }
];
let saved = store.get('gs-channels', null);
if (saved === null) { channels = DEFAULT_CHANNELS.slice(); store.set('gs-channels', channels); } else { channels = saved; }
 
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const grad = s => `linear-gradient(135deg,hsl(${hue(s)},70%,50%),hsl(${(hue(s)+50)%360},75%,55%))`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currentList = () => tab === 0 ? channels : videos;
 
function render() {
  const L = $('list'), list = currentList();
  if (!list.length) {
    L.innerHTML = `<div class="empty">${tab === 0 ? 'சேனல்கள் இல்லை. “+ சேர்” அழுத்தி ஸ்ட்ரீம் URL சேர்க்கவும்.' : 'வீடியோக்கள் இல்லை. “+ சேர்” அழுத்தி உங்கள் தொலைபேசியிலிருந்து வீடியோக்களைச் சேர்க்கவும்.'}</div>`;
    return;
  }
  L.innerHTML = list.map((item, i) => {
    const isCur = (curKind === (tab === 0 ? 'live' : 'video')) && i === cur;
    return `<div class="row ${isCur ? 'cur' : ''}" data-i="${i}">
      <div class="thumb" style="background:${grad(item.name)}">${tab === 0 ? '📡' : '🎬'}</div>
      <div class="i"><div class="t">${esc(item.name)}</div>
      <div class="s">${tab === 0 ? (isCur ? '● நேரலையில்' : 'நேரலை ஸ்ட்ரீம்') : (isCur ? 'இப்போது இயங்குகிறது' : 'உள்ளூர் வீ��ியோ')}</div></div>
      <button class="del" data-d="${i}" aria-label="நீக்கு">✕</button>
    </div>`;
  }).join('');
}
function reset() { if (hls) { hls.destroy(); hls = null; } v.pause(); v.removeAttribute('src'); v.load(); }
function stopPlayback() {
  reset();
  $('live').style.display = 'none'; $('live').classList.remove('pulse');
  $('ph').style.display = 'flex'; cur = -1; curKind = null; render();
}
function setTitle(n, s) { $('tt').textContent = n; $('ts').textContent = s; }
 
function playLive(i) {
  const ch = channels[i]; if (!ch) return;
  cur = i; curKind = 'live';
  setTitle(ch.name, 'நேரலை டிவி');
  $('ph').style.display = 'none'; $('live').style.display = 'inline-block'; $('live').classList.add('pulse');
  render(); reset();
  const url = ch.url;
  if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = url; v.play().catch(() => {}); return; }
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true });
    hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => {}); });
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else { setTitle(ch.name, '⚠ ஸ்ட்ரீம் இயக்க முடியவில்லை'); $('live').style.display = 'none'; hls.destroy(); hls = null; }
      }
    });
  } else { setTitle(ch.name, '⚠ உங்கள் browser-ல் HLS ஆதரவு இல்லை'); $('live').style.display = 'none'; }
}
function playVideo(i) {
  const vid = videos[i]; if (!vid) return;
  cur = i; curKind = 'video';
  setTitle(vid.name, 'உள்ளூர் வீடியோ');
  $('ph').style.display = 'none'; $('live').style.display = 'none'; $('live').classList.remove('pulse');
  render();
  if (hls) { hls.destroy(); hls = null; }
  v.pause(); v.src = vid.url; v.play().catch(() => {});
}
$('addb').onclick = () => {
  if (tab === 0) {
    const name = prompt('சேனல் பெயர்:', 'என் டிவி'); if (!name || !name.trim()) return;
    const url = prompt('HLS ஸ்ட்ரீம் URL (.m3u8):', 'https://'); if (!url || !url.trim()) return;
    if (!/^https?:\/\//i.test(url.trim())) { alert('சரியான URL அல்ல'); return; }
    channels.push({ name: name.trim(), url: url.trim() });
    store.set('gs-channels', channels); render();
  } else { $('f').click(); }
};
$('f').onchange = e => {
  for (const file of e.target.files) videos.push({ name: file.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(file) });
  e.target.value = ''; render();
};
$('list').onclick = e => {
  const d = e.target.closest('[data-d]');
  if (d) {
    const i = +d.dataset.d;
    if (tab === 0) {
      channels.splice(i, 1); store.set('gs-channels', channels);
      if (curKind === 'live' && cur === i) stopPlayback(); else if (curKind === 'live' && cur > i) cur--;
    } else {
      URL.revokeObjectURL(videos[i].url); videos.splice(i, 1);
      if (curKind === 'video' && cur === i) stopPlayback(); else if (curKind === 'video' && cur > i) cur--;
    }
    render(); return;
  }
  const row = e.target.closest('[data-i]');
  if (row) { const i = +row.dataset.i; tab === 0 ? playLive(i) : playVideo(i); }
};
$('t1').onclick = () => { tab = 0; $('t1').className = 'on'; $('t2').className = ''; render(); };
$('t2').onclick = () => { tab = 1; $('t2').className = 'on'; $('t1').className = ''; render(); };
v.onerror = () => { if (v.currentSrc && curKind === 'video' && videos[cur]) setTitle(videos[cur].name, '⚠ வீடியோவை இயக்க முடியவில்லை'); };
v.volume = Math.min(1, Math.max(0, store.get('gs-vol', 0.9)));
v.onvolumechange = () => store.set('gs-vol', v.volume);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
